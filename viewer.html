<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Viewer — Courses Glance</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    /* ── Reset & base ── */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    /* ── Toolbar groups ── */
    .toolbar-group {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    /* ── Zoom level label ── */
    .zoom-level {
      font-size: 0.8rem;
      min-width: 38px;
      text-align: center;
      color: var(--text-primary);
    }

    /* ── Colour swatches ── */
    .color-btn {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      padding: 0;
      flex-shrink: 0;
    }

    .color-btn.active {
      border-color: var(--text-primary);
      transform: scale(1.2);
    }

    .color-yellow {
      background: #facc15;
    }

    .color-green {
      background: #4ade80;
    }

    .color-blue {
      background: #60a5fa;
    }

    .color-pink {
      background: #f472b6;
    }

    .color-orange {
      background: #fb923c;
    }

    /* ── Bookmark fill when active ── */
    #btn-bookmark svg {
      transition: fill 0.2s;
    }

    #btn-bookmark.bookmarked svg {
      fill: var(--accent);
      stroke: var(--accent);
    }

    /* ── Search panel ── */
    .search-panel {
      position: fixed;
      top: var(--toolbar-height, 52px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-top: none;
      border-radius: 0 0 8px 8px;
      padding: 10px 14px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, .12);
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 300;
      width: min(94vw, 380px);
    }

    .search-panel input {
      flex: 1;
      min-width: 0;
      padding: 7px 10px;
      background: var(--bg-primary);
      border: 1.5px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-primary);
      font-size: 0.85rem;
    }

    .search-panel input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .search-status {
      font-size: 0.75rem;
      color: var(--text-muted);
      white-space: nowrap;
      min-width: 52px;
    }

    /* ── KBD hint ── */
    .kbd {
      display: inline-block;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: 3px;
      padding: 1px 5px;
      font-size: 0.7rem;
      color: var(--text-muted);
      font-family: monospace;
    }

    /* ════════════════════════════════════════
       MOBILE TOOLBAR  (≤ 640 px)
       Two rows: brand+nav row  /  tools row
       ════════════════════════════════════════ */
    @media (max-width: 640px) {

      /* Stack the toolbar into two compact rows */
      .viewer-toolbar {
        flex-wrap: wrap;
        height: auto !important;
        padding: 4px 6px !important;
        gap: 0;
      }

      /* Row 1: back + name + right actions */
      .toolbar-brand {
        flex: 1 1 auto;
        min-width: 0;
      }

      .toolbar-right {
        flex: 0 0 auto;
      }

      /* Dividers between rows invisible, used as row-break */
      .toolbar-divider {
        display: none;
      }

      /* Row 2: all tool groups full-width */
      .toolbar-row2 {
        display: flex;
        align-items: center;
        gap: 4px;
        width: 100%;
        padding: 2px 0 2px;
        overflow-x: auto;
        scrollbar-width: none;
      }

      .toolbar-row2::-webkit-scrollbar {
        display: none;
      }

      /* Zoom controls inside row2 */
      .zoom-controls {
        gap: 2px;
      }

      .zoom-level {
        min-width: 30px;
        font-size: 0.75rem;
      }

      /* Highlight colour swatches: smaller on mobile */
      .color-btn {
        width: 16px;
        height: 16px;
      }

      /* Page nav inside row2 */
      .page-nav #page-input {
        width: 36px;
        font-size: 0.8rem;
      }

      .page-total {
        font-size: 0.8rem;
      }

      /* Touch-friendly tap targets */
      .btn-icon {
        min-width: 36px;
        min-height: 36px;
        padding: 6px;
      }

      /* Hide status bar shortcut hints on mobile */
      .viewer-statusbar .kbd {
        display: none;
      }

      /* Thumb sidebar hidden by default on mobile; toggled via JS */
      .thumb-sidebar {
        display: none;
        position: fixed !important;
        left: 0;
        top: var(--toolbar-height, 88px);
        bottom: var(--statusbar-height, 32px);
        z-index: 200;
        width: 80px !important;
        overflow-y: auto;
        background: var(--bg-card);
        border-right: 1px solid var(--border-color);
        box-shadow: 2px 0 8px rgba(0, 0, 0, .15);
      }

      .thumb-sidebar.open {
        display: flex;
        flex-direction: column;
      }

      /* PDF area always full width on mobile */
      .viewer-body {
        flex-direction: row;
      }

      .pdf-canvas-area {
        flex: 1 1 auto;
      }
    }

    /* ── Tablet tweak (641–900px): hide text labels ── */
    @media (max-width: 900px) {
      .toolbar-label {
        display: none;
      }
    }

    /* ── Mobile thumbnail toggle button (only visible on mobile) ── */
    #btn-thumbs {
      display: none;
    }

    @media (max-width: 640px) {
      #btn-thumbs {
        display: flex;
      }
    }
  </style>
</head>

<body class="viewer-layout">

  <!-- ══════════════════════════════════════════
       TOP TOOLBAR
       ══════════════════════════════════════════ -->
  <header class="viewer-toolbar">

    <!-- Back + PDF name -->
    <div class="toolbar-brand">
      <button id="back-btn" class="btn-icon" title="Back to dashboard (Alt+←)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12" />
          <polyline points="12 19 5 12 12 5" />
        </svg>
      </button>
      <span class="pdf-name" id="pdf-name">Loading…</span>
    </div>

    <div class="toolbar-divider"></div>

    <!-- ── DESKTOP: Zoom / Highlight / Page nav inline ── -->
    <!-- These groups are hidden on mobile and re-shown inside .toolbar-row2 -->

    <!-- Zoom controls -->
    <div class="toolbar-group zoom-controls" id="grp-zoom">
      <button id="btn-zoom-out" class="btn-icon" title="Zoom out (Ctrl -)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round">
          <line x1="5" y1="12" x2="19" y2="12" />
        </svg>
      </button>
      <span class="zoom-level" id="zoom-level">125%</span>
      <button id="btn-zoom-in" class="btn-icon" title="Zoom in (Ctrl +)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round">
          <line x1="12" y1="5" x2="12" y2="19" />
          <line x1="5" y1="12" x2="19" y2="12" />
        </svg>
      </button>
    </div>

    <div class="toolbar-divider"></div>

    <!-- Highlight colours -->
    <div class="toolbar-group highlight-tools" id="grp-highlight">
      <button id="btn-highlight" class="btn-icon" title="Highlight mode (H)">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9" />
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" />
        </svg>
      </button>
      <button class="color-btn color-yellow" data-color="yellow" title="Yellow"></button>
      <button class="color-btn color-green" data-color="green" title="Green"></button>
      <button class="color-btn color-blue" data-color="blue" title="Blue"></button>
      <button class="color-btn color-pink" data-color="pink" title="Pink"></button>
      <button class="color-btn color-orange" data-color="orange" title="Orange"></button>
      <button id="btn-erase" class="btn-icon erase-btn" title="Erase mode (E)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 20H7L3 16l11-11 6 6-4.5 4.5" />
          <path d="M6.293 18.707L3 22l3.707-3.707" />
        </svg>
      </button>
    </div>

    <div class="toolbar-divider"></div>

    <!-- Page navigation -->
    <div class="toolbar-group page-nav" id="grp-pagenav">
      <button id="btn-prev" class="btn-icon" title="Previous page">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6" />
        </svg>
      </button>
      <input type="number" id="page-input" value="1" min="1" title="Go to page" />
      <span class="page-total" id="page-total">/ —</span>
      <button id="btn-next" class="btn-icon" title="Next page">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6" />
        </svg>
      </button>
    </div>

    <!-- Right actions -->
    <div class="toolbar-right">

      <!-- Thumbnail toggle (mobile only) -->
      <button id="btn-thumbs" class="btn-icon" title="Toggle thumbnails">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" />
          <rect x="14" y="3" width="7" height="7" />
          <rect x="3" y="14" width="7" height="7" />
          <rect x="14" y="14" width="7" height="7" />
        </svg>
      </button>

      <!-- Bookmark -->
      <button id="btn-bookmark" class="btn-icon" title="Bookmark page (B)">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" />
        </svg>
      </button>

      <!-- Search -->
      <button id="btn-search" class="btn-icon" title="Search in PDF (Ctrl+F)">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
      </button>

      <!-- Theme -->
      <button id="btn-theme" class="btn-icon theme-toggle" title="Toggle dark mode">
        <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
      </button>

      <!-- Logout -->
      <button id="btn-logout" class="btn-icon" title="Logout">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <polyline points="16 17 21 12 16 7" />
          <line x1="21" y1="12" x2="9" y2="12" />
        </svg>
      </button>

    </div>

    <!-- ── MOBILE ROW 2: scrollable tool strip ── -->
    <div class="toolbar-row2" id="toolbar-row2" style="display:none;">
      <!-- Populated by JS on mobile -->
    </div>

  </header>

  <!-- Search panel -->
  <div id="search-panel" class="search-panel hidden">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round">
      <circle cx="11" cy="11" r="8" />
      <line x1="21" y1="21" x2="16.65" y2="16.65" />
    </svg>
    <input type="text" id="search-input" placeholder="Search in PDF…" />
    <button id="btn-search-prev" class="btn-icon" title="Previous match">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="15 18 9 12 15 6" />
      </svg>
    </button>
    <button id="btn-search-next" class="btn-icon" title="Next match">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="9 18 15 12 9 6" />
      </svg>
    </button>
    <span class="search-status" id="search-status"></span>
    <button id="btn-search-close" class="btn-icon" title="Close (Esc)"
      onclick="document.getElementById('search-panel').classList.add('hidden')">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="18" y1="6" x2="6" y2="18" />
        <line x1="6" y1="6" x2="18" y2="18" />
      </svg>
    </button>
  </div>

  <!-- ══════════════════════════════════════════
       BODY: Thumbnail sidebar + PDF area
       ══════════════════════════════════════════ -->
  <div class="viewer-body">

    <div class="thumb-sidebar" id="thumb-sidebar"></div>

    <div class="pdf-canvas-area" id="pdf-canvas-area">
      <div style="text-align:center; padding:80px 20px; color:var(--text-muted);">
        <div class="spinner"
          style="border-color:var(--border-color); border-top-color:var(--accent); width:32px;height:32px;margin:0 auto 16px;">
        </div>
        <p style="font-size:0.9rem;">Loading PDF…</p>
      </div>
    </div>

  </div>

  <!-- STATUS BAR -->
  <footer class="viewer-statusbar">
    <div class="status-item">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-text">Initialising…</span>
    </div>
    <div class="status-item" style="margin-left:auto">
      <span style="font-size:0.7rem; color:var(--text-muted)">
        <span class="kbd">H</span> highlight &nbsp;
        <span class="kbd">E</span> erase &nbsp;
        <span class="kbd">B</span> bookmark &nbsp;
        <span class="kbd">Ctrl+F</span> search
      </span>
    </div>
  </footer>

  <div id="mode-banner" class="mode-banner hidden"></div>
  <div id="toast-container" class="toast-container"></div>

  <script>
    /* ── Mobile row-2 setup ──
       On small screens move the tool groups into the scrollable second row
       so they don't overflow off-screen. Run before viewer.js boots. */
    (function () {
      if (window.innerWidth > 640) return;
      const row2 = document.getElementById('toolbar-row2');
      if (!row2) return;
      row2.style.display = 'flex';

      const ids = ['grp-zoom', 'grp-highlight', 'grp-pagenav'];
      ids.forEach(id => {
        const el = document.getElementById(id);
        if (el) {
          el.style.flexShrink = '0';
          row2.appendChild(el);
        }
      });

      // Insert dividers between groups in row2
      const groups = row2.querySelectorAll('.toolbar-group');
      groups.forEach((g, i) => {
        if (i < groups.length - 1) {
          const sep = document.createElement('div');
          sep.style.cssText = 'width:1px;height:20px;background:var(--border-color);flex-shrink:0;';
          row2.insertBefore(sep, groups[i + 1]);
        }
      });
    })();
  </script>

  <script type="module" src="js/viewer.js"></script>
</body>

</html>
